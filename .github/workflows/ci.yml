name: CI
"on":
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.5 is not decoration: it is where the driver-specific PDO constant
        # aliases (PDO::MYSQL_*, PDO::SQLITE_*) start emitting E_DEPRECATED on
        # every connection. Paired with failOnDeprecation in phpunit.xml, this
        # job is what stops one creeping back in.
        php-version: ["8.4", "8.5"]
    name: PHP ${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # sqlite3 + pdo_sqlite: several plugins configure or exercise the
          # SQLite driver, which references SQLITE3_* constants at class level.
          # pdo_mysql: MySQLConfiguration::pdoOptions() reads \Pdo\Mysql::ATTR_*,
          # which the extension registers — without it the class does not exist
          # and MySQLConfigurationTest fatals rather than fails.
          extensions: json, mbstring, ctype, tokenizer, filter, openssl, curl, fileinfo, sqlite3, pdo_sqlite, pdo_mysql
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage
